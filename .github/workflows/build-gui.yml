name: Windows GUI

on:
  workflow_dispatch:
  push:
    tags: ['gui-*']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/gui-requirements.txt
      - name: Install pinned packaging dependencies
        run: python -m pip install -r tools/gui-requirements.txt
      - name: Test GUI and USB maintenance logic
        run: |
          python tests/gui_parser.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI parser tests failed' }
          python tests/gui_connection.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI connection tests failed' }
          python tests/gui_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI lifecycle/rendering tests failed' }
          python tests/dfu_helper.py
          if ($LASTEXITCODE -ne 0) { throw 'DFU helper tests failed' }
      - name: Test portable firmware modules
        run: ./tools/test_host.ps1 -VcVars 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
      - name: Build standalone EXE and portable ZIP
        run: python tools/build_gui.py
      - name: Smoke test the packaged EXE
        run: |
          $report = Join-Path $PWD 'dist/gui-selftest.json'
          $app = Start-Process ./dist/STM32FC-GUI.exe -ArgumentList ('--self-test "' + $report + '"') -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged GUI test timed out' }
          if ($app.ExitCode -ne 0) { throw 'Packaged GUI test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'Packaged GUI did not pass' }
          Get-Content $report
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: STM32FC-GUI-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-diagnostics
          path: |
            build/host/*-build.txt
            build/host/*-results.txt
            build/host/*-metrics.txt
            build/gui-assets/build-info.json
            dist/gui-selftest.json
