; STM32FC -- fixed-wing flight controller for a twin-EDF Boeing 787 model.
; See CLAUDE.md and README.md before touching code.
;
; Layout (CLAUDE.md "Target layout"):
;   src/hal/            hardware abstraction -- the ONLY layer touching STM32/Arduino
;     hal.hpp             interface both backends implement
;     stm32/             real hardware backend
;     native/            desktop backend for tests / SITL
;   src/drivers/        bmi323, bmp581, ublox   (hal only, portable)
;   src/estimation/     ahrs                    (portable)
;   src/core/           usb_stream, sd_csv_log  (BENCH scaffolding, STM32-only -- see note)
;   src/main_stm32.cpp  application entry (setup/loop)
;   src/main_native.cpp [env:native] entry
;
; core/usb_stream and core/sd_csv_log deliberately break the "no Arduino outside
; hal/stm32" rule: they are throwaway bench scaffolding (USB CDC telemetry + CSV
; SD log) that is deleted once the restructure is validated. They are excluded
; from [env:native].

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = arduino

; Flash over the STM32 ROM bootloader (USB DFU, 0483:df11)
upload_protocol = dfu

build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USB_MANUFACTURER=\"STM32FC\"
  -D USB_PRODUCT=\"F407_BMI323_IMU\"
  ; Bound the blocking Wire (BMP581 I2C) transfer timeout. Core default is
  ; I2C_TIMEOUT_TICK=100 (~100 ms); a wedged bus must not stall the loop that
  ; long. Real fix is a hal-backed non-blocking I2C state machine later.
  -D I2C_TIMEOUT_TICK=10
  ; Enlarge the USB CDC TX queue (default 2*64=128 B) so the non-blocking line
  ; logger can push the longest debug line in one atomic write. Bench only.
  -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=6
  ; CRSF is ~10 kB/s; the 100 Hz parse task must not overflow the RX ring
  ; between polls (core default 64). Real fix is DMA circular RX later.
  -D SERIAL_RX_BUFFER_SIZE=256

build_src_filter = +<*> -<main_native.cpp> -<hal/native/> -<probe/>

monitor_speed = 115200
monitor_port = /dev/ttyACM0

; ---------------------------------------------------------------------------
; Diagnostic: read the ER8 CRSF link (USART3 PB11/PB10) and stream it to USB.
; NOT flight firmware. src/probe/crsf_probe.cpp + drivers/crsf.
; ---------------------------------------------------------------------------
[env:crsf_probe]
platform = ststm32
board = black_f407ve
framework = arduino
upload_protocol = dfu
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USB_MANUFACTURER=\"STM32FC\"
  -D USB_PRODUCT=\"F407_CRSF_PROBE\"
  -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=6
  -D SERIAL_RX_BUFFER_SIZE=256      ; headroom at 420000 baud between polls
build_src_filter =
  +<probe/crsf_probe.cpp>
  +<hal/hal.hpp>
  +<hal/stm32/>
  +<drivers/crsf.cpp>
  +<core/usb_stream.cpp>
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; ---------------------------------------------------------------------------
; Desktop build: portable layers only (hal.hpp consumers), native hal backend.
; Proves drivers/ and estimation/ stay free of Arduino/STM32 includes.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter =
  +<*>
  -<main_stm32.cpp>
  -<hal/stm32/>
  -<core/usb_stream.cpp>
  -<core/sd_csv_log.cpp>
  -<core/sd_bin_log.cpp>
  -<probe/>
lib_ignore = STM32SD, FatFs, SPI, Wire
