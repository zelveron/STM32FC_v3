[platformio]
default_envs = v2_bmi270

[env:v2]
platform = ststm32@19.7.1
board = black_f407vg
board_upload.maximum_size = 1048576
board_build.ldscript = ld/stm32f407vg.ld
framework = arduino
platform_packages = framework-arduinoststm32@4.21200.0
upload_protocol = dfu
build_unflags = -std=gnu++14 -std=gnu++11
build_flags =
  -std=gnu++17
  -D HSE_VALUE=8000000U
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USB_MANUFACTURER=\"STM32FC\"
  -D USB_PRODUCT=\"STM32FC_V2_DEV\"
  -D I2C_TIMEOUT_TICK=2
  ; Fit the complete scheduler/status burst without blocking the control loop.
  -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=32
  -D SERIAL_RX_BUFFER_SIZE=512
build_src_filter = +<*> -<main_native.cpp> -<main_sitl.cpp> -<hal/native/> -<probe/> -<sitl/>
monitor_speed = 115200

; Explicit opt-in after electrical rework and propeller-off acceptance checks.
; Compiling this profile does not qualify the aircraft for flight.
[env:v2_motor_test]
extends = env:v2
build_flags =
  ${env:v2.build_flags}
  -D FC_FLIGHT_ENABLED=1

; Full aircraft firmware with CH5 motor authorization. Same control/arming
; logic as v2_motor_test; this explicit name identifies the flight image.
[env:v2_flight]
extends = env:v2_motor_test

; Current card: dual BMI270, magnetometer disabled, motors inhibited.
[env:v2_bmi270]
extends = env:v2
build_flags =
  ${env:v2.build_flags}
  -D FC_MAG_ENABLED=0
  -D FC_FLIGHT_ENABLED=0

[env:crsf_probe]
extends = env:v2
build_src_filter = +<probe/crsf_probe.cpp> +<hal/stm32/> +<drivers/crsf.cpp> +<core/usb_stream.cpp>

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter =
  +<main_native.cpp>
  +<control/>
  +<modes/>
  +<estimation/>
  +<hal/native/>
  +<core/arming.cpp>
  +<core/failsafe.cpp>
  +<core/scheduler.cpp>
  +<core/log_ring.cpp>
  +<core/log_frame.cpp>
lib_ignore = STM32SD, FatFs, SPI, Wire, bmi270, bmm350, bmp5

[env:sitl]
platform = native
build_flags = -std=gnu++17 -O2 -Wall -Wextra
build_src_filter = +<main_sitl.cpp> +<sitl/> +<control/> +<modes/> +<estimation/>
lib_ignore = STM32SD, FatFs, SPI, Wire, bmi270, bmm350, bmp5
